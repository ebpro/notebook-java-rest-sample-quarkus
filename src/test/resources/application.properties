# Tests use Testcontainers-managed Postgres via PostgresTestResource
# The PostgresTestResource starts a container and injects datasource properties.

# Reduce logging noise during tests
quarkus.log.category."org.hibernate".level=WARN
application.properties

# 1. Tell the server to pick a random available port
quarkus.http.test-port=0

# 2. Tell the Rest Client to talk to whatever port was picked
quarkus.rest-client.product-api.url=http://localhost:${quarkus.http.test-port}

# Désactive la conversion automatique des erreurs 4xx/5xx en Exceptions
# Cela permet à Uni<Response> de renvoyer l'objet Response même en cas de 409
quarkus.rest-client.product-api.disable-default-mapper=true
